name: Tests

# Runs the wearable-events test suite (tests/, pytest) on every push
# and pull request. No live InfluxDB or Docker involved - see
# wearable-events/tests/conftest.py's own docstring for how the suite
# avoids needing either (a temp SQLite file per run, plus an
# obviously-fake INFLUX_URL so any test that accidentally exercises a
# real Influx code path fails fast instead of hanging).
#
# Only the wearable-events app has a test suite right now - if
# parser/colmi or parser/amazfit gain one later, add a job for each
# here rather than trying to force everything through one job.

on:
  push:
    branches: ["main"]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  wearable-events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearable-events
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v
